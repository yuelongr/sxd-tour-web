:root{--bg:#0f0e0c;--panel:#1c1a16;--line:#2c2820;--gold:#c9a35c;--txt:#e8e2d5;--dim:#8a8272}

html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 14px 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}

#mapwrap{flex:1;position:relative;min-height:120px}
canvas#map{position:absolute;left:0;top:0;width:100%;height:100%}
.floors{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.floors button{padding:4px 10px;font-size:12px;border-radius:20px;opacity:.55}
.floors button.on{opacity:1;border-color:var(--gold);color:var(--gold)}
#cur{padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}

#cur .m{font-size:12px;color:var(--dim);margin-top:2px}
#bar{padding:10px 14px;display:flex;align-items:center;gap:10px}
#bar .time{font-size:12px;color:var(--dim);min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.big{width:52px;height:52px;border-radius:50%;background:#3a352b;color:var(--txt);border:none;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mid{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
#list{height:150px;overflow-y:auto;padding:0 14px 10px}
#list .row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--dim)}
#list .row.cur{background:#2a2418;color:var(--txt)}
#list .row .n{width:22px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
#list .row .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .row .fl{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;flex-shrink:0}
#toasts{position:fixed;top:54px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:#000c;color:var(--txt);padding:6px 14px;border-radius:16px;font-size:12px;animation:tt 2.6s forwards}
@keyframes tt{0%{opacity:0;transform:translateY(-8px)}12%,80%{opacity:1}100%{opacity:0}}
#pick{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;z-index:10}
#pick .sheet{background:var(--panel);border-radius:14px 14px 0 0;max-height:70%;overflow-y:auto;width:100%;padding:14px}
#pick h2{font-size:14px;color:var(--gold);margin-bottom:8px}
#pick .v{padding:9px 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:13px}
#pick .v.on{color:var(--gold)}
#pick .v small{color:var(--dim)}
#bpick{padding:5px 12px;font-size:12px;border-radius:14px;white-space:nowrap}
#gate{position:fixed;inset:0;background:#0f0e0c;display:flex;align-items:center;justify-content:center;z-index:99}
#gate .gatebox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;gap:10px;width:76%;max-width:320px}
#gate h3{color:var(--gold);font-size:16px}
#gate p{color:var(--dim);font-size:12px}
#gate input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none}
#gate button{background:var(--gold);color:#141210;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600}
</style>
</head>

<script>
/* 访问门禁(在线版单文件用):输入密码 → SHA-256 比对 → 解锁。
 * 静态站无服务端,本质是"遮幕"而非强加密;路人被挡,懂技术者需翻源码。
 * 换密码:改 gate.js 里 H 为 新密码 的 SHA-256(小写hex),重新跑 make_online.py 并部署。
 */
(function () {
  var G = document.getElementById("gate");
  if (!G) return;
  var H = "4f8568e0c16117bc8cedee09ccaba90733ae3fd22e4d0a9ca564f3b9ae7ac809";
  var inp = G.querySelector("input"), btn = G.querySelector("button");
  async function go() {
    var v = (inp.value || "").trim();
    if (!v) return;
    var d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
    var h = [...new Uint8Array(d)].map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    if (h === H) { G.style.display = "none"; sessionStorage.setItem("sxd94", "1"); }
    else { inp.value = ""; inp.placeholder = "再试试"; inp.focus(); }
  }
  btn.onclick = go;
  inp.onkeydown = function (e) { if (e.key === "Enter") go(); };
  if (sessionStorage.getItem("sxd94")) G.style.display = "none";
})();

</script>
<script>
/* 三星堆随身讲解 — 共享逻辑(本地版 index.html / 在线版 online.html 通用)
 * 音频源模式 CFG.mode:
 *   "local"  → audio/<file>(同源 http 服务,或 file:// 相对路径)
 *   "remote" → 官方 CDN 原链 url(单文件免部署,免下载;无 CORS → 人声走 <audio>,BGM 走合成)
 *   "file"   → 手机里选本地文件夹,objectURL(微信纯文件模式)
 */
"use strict";
const CFG = window.SXDCFG || {mode: new URLSearchParams(location.search).has("file") ? "file" : "local"};
const $ = s => document.querySelector(s);
const isFile = () => CFG.mode === "file" || new URLSearchParams(location.search).has("file");

let DATA = null, ver = null, pts = [], idx = 0, playing = false, floor = null, geoOn = false, geoTimer = null,
    speed = 1, raf = 0,
    AC = null, curBuf = null, srcNode = null, gainNode = null, elA = null,
    bgmEl = null, bgmSynth = null, resumeOff = 0, decodeToken = 0, loc = null, bgmOn = false;   // 默认关,🎵 可开

/* ---------------- 数据与音频源 ---------------- */
function audioUrl(row) {
  if (isFile()) {
    const norm = s => s.replace(/^audio\//, "");
    const f = [...$("#dirpick").files].find(x => norm(x.webkitRelativePath) === norm(row.file));
    return f ? URL.createObjectURL(f) : null;
  }
  return CFG.mode === "remote" ? row.url : row.file;   // row.file 已是 web 根相对路径(audio/…)
}
async function loadManifest() {
  if (window.SXDDATA) return window.SXDDATA;               // 在线版内联
  const r = await fetch("data/manifest-web.json");
  return await r.json();
}
async function ensureFilePick() {                           // 文件模式:确保已选文件夹
  const el = $("#dirpick");
  if (el.files.length) return;
  toast("请选择音频文件夹(out/web/audio)");
  el.click();
  while (!el.files.length) await new Promise(r => setTimeout(r, 300));
  if (!el.files[0]) { location.reload(); return; }
}

/* ---------------- Web Audio(人声 + BGM 双轨) ---------------- */
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function loadBuf(row, token) {
  if (CFG.mode === "remote") { elFallback(row); return; }   // CDN 无 CORS → 直接原生播放
  const a = ac(); if (!a) { elFallback(row); return; }
  fetch(audioUrl(row)).then(r => r.arrayBuffer()).then(ab => a.decodeAudioData(ab))
    .then(b => {
      if (token !== decodeToken) return;
      curBuf = b;
      if (playing && !srcNode) startSrc();
      $("#ttime").textContent = "00:00 / " + fmt(b.duration);
    }).catch(() => { if (token === decodeToken) elFallback(row); });
}
function stopSrc() {
  if (elA) { elA.pause(); elA = null; }
  if (srcNode) {
    try { resumeOff = srcNode.playbackTime || 0;
      if (gainNode) gainNode.gain.setTargetAtTime(0, AC.currentTime, .12); } catch (e) { }
    const s = srcNode; setTimeout(() => { try { s.stop(); } catch (e) { } }, 300);
    srcNode = null; gainNode = null;
  }
}
function startSrc() {
  stopSrc(); if (!curBuf || curBuf.el) return;
  const s = AC.createBufferSource(); s.buffer = curBuf; s.playbackRate.value = speed;
  const g = AC.createGain(); g.gain.value = 0;
  s.connect(g); g.connect(AC.destination);
  s.onended = () => { if (srcNode === s) onEnd(); };
  g.gain.setTargetAtTime(1, AC.currentTime, .15);
  s.start(0, Math.min(resumeOff, Math.max(0, curBuf.duration - .05))); resumeOff = 0;
  srcNode = s; gainNode = g;
}
function elFallback(row) {
  stopSrc(); const a = new Audio(audioUrl(row)); a.playbackRate = speed;
  a.onended = () => { if (playing) setIdx(idx + 1); else { playing = false; updPlay(); } };
  a.play().catch(() => toast("音频加载失败(在线版需要网络)"));
  elA = a; curBuf = { el: a };
}
function onEnd() { srcNode = null; gainNode = null; curBuf = null; if (playing) setIdx(idx + 1); else { playing = false; updPlay(); } }

/* BGM:云冈免费路线拼接(本地) 或 Web Audio 合成(五声 ambient) */
function bgmStop() {
  if (bgmEl) { try { bgmEl.pause(); } catch (e) { } bgmEl.src = ""; bgmEl = null; }
  if (bgmSynth) {
    try { bgmSynth.gain.setTargetAtTime(0, AC.currentTime, .5); } catch (e) { }
    const s = bgmSynth; setTimeout(() => { try { s.stop(); } catch (e) { } }, 600); bgmSynth = null;
  }
}
async function bgmStart() {
  bgmStop(); if (!ac()) return;
  if (CFG.mode !== "remote" && !isFile()) {
    const a = document.createElement("audio"); a.src = "audio/bgm-yungang.mp3"; a.loop = true; a.volume = .3;
    try { await a.play(); bgmEl = a; return; } catch (e) { a.src = ""; }
  }
  try {
    const master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    master.gain.setTargetAtTime(.14, AC.currentTime, 2);
    for (const f of [110, 130.81, 164.81, 196, 220, 261.63]) {   // C 宫调 ambient
      const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = AC.createGain(); g.gain.value = .25 + Math.random() * .2;
      const lfo = AC.createOscillator(); lfo.frequency.value = .04 + Math.random() * .07;
      const lg = AC.createGain(); lg.gain.value = .25; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(master); o.start();
    }
    bgmSynth = master;
  } catch (e) { }
}

/* ---------------- 播放控制 ---------------- */
function updPlay() {
  $("#bplay").textContent = playing ? "⏸" : "▶";
  $("#bplay").style.background = playing ? "var(--gold)" : "#3a352b";
  draw();
}
function setIdx(i) {
  if (!pts.length) return;
  idx = Math.max(0, Math.min(pts.length - 1, i));
  resumeOff = 0; decodeToken++;
  stopSrc(); curBuf = null; elA = null;
  if (playing) loadBuf(pts[idx], decodeToken);
  renderList(); draw();
}
$("#bplay").onclick = () => {
  if (!pts.length) { openPick(); return; }
  ac(); playing = !playing; updPlay();
  if (playing) {
    if (bgmOn && !bgmEl && !bgmSynth) bgmStart();
    if (!curBuf && !elA) loadBuf(pts[idx], decodeToken);
    if (curBuf && !curBuf.el) startSrc();
    if (elA) elA.playbackRate = speed;
    if (navigator.vibrate) navigator.vibrate(30);
  } else { stopSrc(); bgmStop(); }
};
$("#bbgm").onclick = () => {
  bgmOn = !bgmOn;
  $("#bbgm").style.opacity = bgmOn ? 1 : .35;
  if (!bgmOn) bgmStop();
  else if (playing) bgmStart();
  toast(bgmOn ? "背景乐开" : "背景乐关");
};
$("#bprev").onclick = () => setIdx(idx - 1);
$("#bnext").onclick = () => setIdx(idx + 1);
$("#speed").onclick = () => {
  const order = [1, 1.25, 1.5, 2, 1];
  speed = order[order.indexOf(speed) + 1] || 1;
  $("#speed").textContent = speed + "x";
  if (srcNode) srcNode.playbackRate.value = speed;
  if (elA) elA.playbackRate = speed;
};

/* ---------------- 地图(canvas) ---------------- */
const cv = $("#map"), cx = cv.getContext("2d");
function sizeCanvas() {
  const d = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
function fmt(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function toast(s) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = s;
  $("#toasts").append(t); setTimeout(() => t.remove(), 2600);
}
function syncTime() {
  const c = pts[idx]; if (!c) return;
  if (curBuf && !curBuf.el) $("#ttime").textContent = fmt((AC ? AC.currentTime : 0) % (curBuf.duration || 1)) + " / " + fmt(curBuf.duration);
  else if (curBuf && curBuf.el) $("#ttime").textContent = fmt(elA ? elA.currentTime : 0) + " / " + (elA ? Math.round(elA.duration || 0) : c.time || 0);
}
function proj() {
  const vis = pts.filter(p => !floor || p.floor === floor);
  if (!vis.length) return null;
  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  for (const p of vis) {
    if (p.lat == null) continue;
    mnx = Math.min(mnx, p.lon); mxx = Math.max(mxx, p.lon);
    mny = Math.min(mny, p.lat); mxy = Math.max(mxy, p.lat);
  }
  if (mxx - mnx < 1e-6) mxx = mnx + 1e-6; if (mxy - mny < 1e-6) mxy = mny + 1e-6;
  const W = cv.clientWidth, H = cv.clientHeight, pad = 26;
  const k = Math.min((W - 2 * pad) / (mxx - mnx), (H - 2 * pad) / (mxy - mny));
  // 中心居中: x = W/2 + k*(lon-中经), y = H/2 - k*(lat-中纬)
  const ox = (W - k * (mxx - mnx)) / 2, oy = (H + k * (mxy - mny)) / 2;
  return p => [ox + k * (p.lon - mnx), oy - k * (p.lat - mny)];
}
function draw() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const W = cv.clientWidth, H = cv.clientHeight;
    cx.clearRect(0, 0, W, H);
    const pj = proj(); if (!pj) return;
    const vis = pts.filter(p => !floor || p.floor === floor);
    cx.lineWidth = 1.5; cx.strokeStyle = "#3d362a"; cx.beginPath();
    let first = true;
    for (const p of vis) { if (p.lat == null) continue; const [x, y] = pj(p); first ? cx.moveTo(x, y) : cx.lineTo(x, y); first = false; }
    cx.stroke();
    for (const p of vis) {
      if (p.lat == null) continue;
      const [x, y] = pj(p);
      const isCur = p === pts[idx], done = pts.indexOf(p) < idx;
      cx.beginPath(); cx.arc(x, y, isCur ? 8 : 5, 0, 7);
      cx.fillStyle = isCur ? "#c9a35c" : done ? "#6f5f3d" : "#3a352b"; cx.fill();
      if (isCur) {
        cx.beginPath(); cx.arc(x, y, 14 + 3 * Math.sin(Date.now() / 300), 0, 7);
        cx.strokeStyle = "#c9a35c88"; cx.lineWidth = 2; cx.stroke();
        cx.fillStyle = "#e8e2d5"; cx.font = "600 12px sans-serif"; cx.textAlign = "center";
        cx.fillText((p.title || "?").slice(0, 8), x, y - 12);
      }
    }
    if (geoOn && loc) {
      const [x, y] = pj({ lat: loc.lat, lon: loc.lon });
      cx.beginPath(); cx.arc(x, y, 6, 0, 7); cx.fillStyle = "#5cb0ff"; cx.fill();
      cx.strokeStyle = "#fff8"; cx.lineWidth = 1.5; cx.stroke();
    }
    if (playing && curBuf) syncTime();          // 播放中持续刷新时间,不依赖列表事件
    if (playing || geoOn) raf = requestAnimationFrame(draw);
  });
}
function renderList() {
  $("#list").innerHTML = pts.map((p, i) =>
    `<div class="row ${i === idx ? "cur" : ""}" data-i="${i}"><span class="n">${i + 1}</span><span class="tt">${p.title || "?"}</span><span class="fl">${p.floor || ""}</span><span style="color:var(--dim);font-size:11px">${fmt(p.time || 0)}</span></div>`).join("");
  $("#list").querySelectorAll(".row").forEach(r => r.onclick = () => setIdx(+r.dataset.i));
  const c = pts[idx];
  $("#curt").textContent = c ? (idx + 1) + " · " + (c.title || "?") : "—";
  $("#curm").textContent = c ? [c.floor, Math.round(c.time || 0) + "秒"].join(" · ") : "—";
  $("#hsub").textContent = ver ? `${ver.routeName} / ${ver.name} · ${pts.length}站 · ${fmt((ver.rows || []).reduce((a, b) => a + (b.time || 0), 0))}` : "";
  if (!c) { $("#ttime").textContent = ""; return; }
  if (curBuf) syncTime();
  else $("#ttime").textContent = "00:00 / " + fmt(c.time || 0);
}

/* ---------------- 地理围栏 ---------------- */
function distM(a, b) {
  const R = 6371e3, rd = Math.PI / 180;
  const dLa = (b.lat - a.lat) * rd, dLo = (b.lon - a.lon) * rd * Math.cos((a.lat + b.lat) / 2 * rd);
  return Math.sqrt(dLa * dLa + dLo * dLo) * 1000;
}
$("#bpick").onclick = () => openPick();
$("#hsub").onclick = () => openPick();
$("#hsub").style.cursor = "pointer";
$("#bgeo").onclick = () => {
  if (!navigator.geolocation) { toast("此浏览器不支持定位"); return; }
  geoOn = !geoOn; $("#bgeo").style.opacity = geoOn ? 1 : .45;
  if (!geoOn) { clearInterval(geoTimer); geoTimer = null; return; }
  const nav = g => {
    loc = { lat: g.coords.latitude, lon: g.coords.longitude };
    if (playing && !elA) { resumeOff = 0; if (curBuf) startSrc(); }
    for (let i = idx + 1; i < Math.min(idx + 8, pts.length); i++) {
      const p = pts[i];
      if (p.lat != null && loc && distM(loc, p) < 30) {
        toast("到达 · " + (p.title || ""));
        if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
        setIdx(i); break;
      }
    }
  };
  const once = () => navigator.geolocation.getCurrentPosition(nav, () => { },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 });
  once(); geoTimer = setInterval(once, 5000);
  toast("地理围栏已开(进入 30 米自动跳下一站)");
  draw();
};

/* ---------------- 选择器 ---------------- */
function openPick() {
  $("#picklist").innerHTML = DATA.versions.map((v, i) =>
    `<div class="v ${v === ver ? "on" : ""}" data-i="${i}"><span>${v.routeName} · ${v.name}</span><small>${(v.rows || []).length}站 · ${Math.round((v.rows || []).reduce((a, b) => a + (b.time || 0), 0) / 60)}分钟${v.price ? " · ¥" + v.price : " · 免费"}</small></div>`).join("");
  $("#pick").style.display = "flex";
  $("#picklist").querySelectorAll(".v").forEach(r => r.onclick = () => {
    if (isFile()) ensureFilePick().then(apply);
    else apply();
    function apply() {
      ver = DATA.versions[+r.dataset.i];
      pts = ver.rows.map(x => ({ title: x.title, floor: x.floor, lat: x.lat, lon: x.lon, time: x.time, file: x.file, url: x.url }));
      idx = 0; floor = null; buildFloors();
      $("#pick").style.display = "none";
      const b = $("#bpick"); if (b) b.textContent = "切换 ▾";
      setIdx(0); toast(`${ver.name} · 共${pts.length}站`);
    }
  });
  $("#pick").onclick = e => { if (e.target.id === "pick") $("#pick").style.display = "none"; };
  const b = $("#bpick"); if (b) b.textContent = ver ? "切换 ▾" : "选版本 ▾";
}
function buildFloors() {
  const fs = [...new Set(pts.map(p => p.floor).filter(Boolean))].sort();
  $("#floors").innerHTML = `<button class="${!floor ? "on" : ""}" data-f="">全部</button>` +
    fs.map(f => `<button class="${floor === f ? "on" : ""}" data-f="${f}">${f}</button>`).join("");
  $("#floors").querySelectorAll("button").forEach(b => b.onclick = () => { floor = b.dataset.f || null; buildFloors(); draw(); });
}

/* ---------------- 启动 ---------------- */
(async function () {
  sizeCanvas();
  addEventListener("resize", () => { sizeCanvas(); draw(); });
  $("#dirpick").addEventListener("change", () => { if ($("#dirpick").files.length) toast(`已加载 ${$("#dirpick").files.length} 个音频文件`); });
  try {
    DATA = await loadManifest();
    if (!DATA.versions.length) throw new Error("empty");
    const missing = DATA.versions.filter(v => v.rows.some(x => !x.url && CFG.mode === "remote"));
    if (missing.length && CFG.mode === "remote") toast(`${missing.length} 个版本缺在线地址,已跳过`);
    openPick();
    const first = $("#picklist .v");   // 自动打开首个版本,手机不必干等选择(querySelector 已返回单元素)
    if (first) first.click();
  } catch (e) {
    $("#hsub").textContent = "数据加载失败: " + e.message;
    toast("本地版需要 data/manifest-web.json(跑 scripts/prepare_web.py)");
  }
})();

</script>
</body>
</html>
